github/workflows/ubuntu-ssh.yml
name: Ubuntu SSH Free VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone to Asia/Tehran
        run: |
          sudo timedatectl set-timezone Asia/Tehran
          date

      - name: Create user and set password
        run: |
          sudo useradd -m sohrab -s /bin/bash || true
          echo 'sohrab:StrongPass123' | sudo chpasswd
          sudo usermod -aG sudo sohrab
          echo 'sohrab ALL=(ALL) NOPASSWD:ALL' | sudo EDITOR='tee -a' visudo

      - name: Install and configure OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl enable ssh
          sudo systemctl start ssh
          sudo ufw allow ssh || true
          echo "SSH server status:"
          sudo systemctl status ssh --no-pager

      - name: Install cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -O cloudflared.deb
          sudo dpkg -i cloudflared.deb || sudo apt-get -f install -y
          cloudflared --version

      - name: Run cloudflared tunnel (no auth quick tunnel)
        run: |
          cloudflared tunnel --url ssh://localhost:22 --no-autoupdate 2>&1 | tee cloudflared.log &
          sleep 15
          echo "==============="
          echo "Cloudflared log:"
          echo "==============="
          cat cloudflared.log | sed -n '1,120p'
          echo "==============="

      - name: Show connection info
        run: |
          echo "User: sohrab"
          echo "Password: StrongPass123"
          echo "به لاگ cloudflared بالا نگاه کن و آدرس دامنه *.trycloudflare.com را پیدا کن."
          echo "با فرمت زیر به سرور وصل شو:"
          echo "ssh sohrab@YOUR_TRYCLOUDFLARE_HOST"
          echo "یا در ویندوز:"
          echo "ssh sohrab@YOUR_TRYCLOUDFLARE_HOST -p 22"

      - name: Keep alive
        run: |
          echo "Server is running. Sleeping to keep job alive..."
          while true; do
            date
            sleep 60
          done
